; Configuracion minima del PHP portable para Tecnicas Contables.
; No requiere instalacion: se usa con "php -S" desde ejecutar.bat.

extension_dir = "ext"

; Base de datos: SQLite (modo por defecto) y MySQL (si se cambia DB_MOTOR).
extension = pdo_sqlite
extension = pdo_mysql
extension = mbstring

; Zona horaria para que las fechas del sistema sean correctas.
date.timezone = "America/El_Salvador"
